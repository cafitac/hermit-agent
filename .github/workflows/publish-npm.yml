name: Release Hermit

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "Publish the npm, PyPI, and Claude Desktop artifacts for the committed version"
        required: true
        default: false
        type: boolean

concurrency:
  group: release-hermit
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    if: github.event.inputs.confirm_publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: pip install -e ".[test]"
      - name: Run test suite
        run: pytest tests/ -q

  build_release_assets:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Read and verify the committed release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          PYTHON_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$VERSION" = "$PYTHON_VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify package and source checks
        run: |
          python -m pip install --upgrade pip build
          python -m compileall -q hermit_agent
          git diff --check
          npm_config_cache="$(mktemp -d)" npm pack --dry-run
      - name: Build PyPI distributions and Claude Desktop extension
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m build --outdir dist/python
          python scripts/build_mcpb.py --version "$VERSION" --output "dist/hermit-$VERSION.mcpb"
      - name: Verify public package contents
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/verify_release_artifacts.py --version "$VERSION" --dist-dir dist/python
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: hermit-release-assets
          path: dist/
          if-no-files-found: error

  publish_npm:
    needs: build_release_assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Publish npm package
        env:
          VERSION: ${{ needs.build_release_assets.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if npm view "@cafitac/hermit-agent@$VERSION" version >/dev/null 2>&1; then
            echo "npm version $VERSION is already published."
            exit 0
          fi
          env -u NODE_AUTH_TOKEN npm publish --access public --provenance

  publish_pypi:
    needs: build_release_assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hermit-release-assets
          path: dist
      - name: Publish PyPI package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/python
          skip-existing: true

  verify_public_install:
    needs: [build_release_assets, publish_npm, publish_pypi]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build_release_assets.outputs.version }}
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Verify clean public npm install and MCP stdio handshake
        shell: bash
        run: |
          set -euo pipefail
          VERIFY_ROOT="$(mktemp -d)"
          export HERMIT_HOME="$VERIFY_ROOT/home"
          mkdir -p "$HERMIT_HOME" "$VERIFY_ROOT/work"
          npm install --prefix "$VERIFY_ROOT/npm" "@cafitac/hermit-agent@$VERSION"
          set +e
          "$VERIFY_ROOT/npm/node_modules/.bin/hermit" doctor --cwd "$VERIFY_ROOT/work"
          doctor_status=$?
          set -e
          test "$doctor_status" -eq 1
          HERMIT_MCP_AUTO_GATEWAY=0 "$HERMIT_HOME/.hermit/npm-runtime/venv/bin/python3" - <<'PY'
          import anyio
          import os
          from mcp import ClientSession
          from mcp.client.stdio import StdioServerParameters, stdio_client

          root = os.environ["HERMIT_HOME"].removesuffix("/home")

          async def verify() -> None:
              parameters = StdioServerParameters(
                  command=f"{root}/npm/node_modules/.bin/hermit",
                  args=["mcp-server"],
                  cwd=f"{root}/work",
                  env={**os.environ, "HERMIT_MCP_AUTO_GATEWAY": "0", "HERMIT_LOG_PATH": os.devnull},
              )
              async with stdio_client(parameters) as (read_stream, write_stream):
                  async with ClientSession(read_stream, write_stream) as session:
                      initialized = await session.initialize()
                      tools = await session.list_tools()
              assert initialized.serverInfo.name == "hermit"
              assert [tool.name for tool in tools.tools] == ["run_task", "reply_task", "check_task", "cancel_task"]

          anyio.run(verify)
          PY

  publish_github_release:
    needs: [build_release_assets, publish_npm, publish_pypi, verify_public_install]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.build_release_assets.outputs.tag }}
      VERSION: ${{ needs.build_release_assets.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: hermit-release-assets
          path: dist
      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "$RELEASE_TAG"
      - name: Create or update GitHub Release with all artifacts
        shell: bash
        run: |
          set -euo pipefail
          NOTES=$(mktemp)
          python3 scripts/render_release_notes.py \
            --tag "$RELEASE_TAG" \
            --version "$VERSION" \
            --repo "${{ github.repository }}" \
            --reason "manual approved release" \
            --out "$NOTES"
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --title "$RELEASE_TAG" --notes-file "$NOTES"
          else
            gh release create "$RELEASE_TAG" --repo "${{ github.repository }}" --verify-tag --title "$RELEASE_TAG" --notes-file "$NOTES"
          fi
          gh release upload "$RELEASE_TAG" dist/*.mcpb dist/python/* --repo "${{ github.repository }}" --clobber
